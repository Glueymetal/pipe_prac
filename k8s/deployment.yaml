apiVersion: apps/v1
kind: Deployment
metadata:
 name: pipeline-app
spec:
 replicas: 2
 selector:
  matchLabels:
   app: pipeline-app
 template:
  metadata:
   labels:
    app: pipeline-app
  spec:
   containers:
    - name: pipeline-app
      image: pipeline-image:1
      imagePullPolicy: IfNotPresent
      ports:
      - containerPort: 3000